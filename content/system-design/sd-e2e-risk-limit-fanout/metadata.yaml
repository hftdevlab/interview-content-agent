      "rendered_file": "recovery-sequence.svg",
      "caption": "Authority isolation prevents renewal, but Gate7's independent per-order deadline check still forces stale behavior.",
      "alt_text": "The S7 receiver sends fresh challenge n902 to the dispatcher. Forwarding it to the scope sequencer fails because the authority link is down, so no matching head proof returns. Independently, Gate7 compares its monotonic clock with the stored deadline on every order and performs the configured stale action after expiry."
