      "rendered_file": "context.svg",
      "caption": "The physical good path carries committed content and a certified, nonce-bound authority proof into a view whose deadline Gate7 checks on every order.",
      "alt_text": "A risk command passes through the API and sequencer to a quorum-committed log. A dispatcher tails committed records, forwards a receiver challenge, and relays a certified head proof containing epoch, content identity, and nonce. The receiver atomically publishes the table and proof deadline, while the Gate7 order thread checks that deadline itself and performs the stale action after expiry even if the receiver stalls."
