  "diagrams": [
    {
      "source_file": "diagrams/step1-live-path.dot",
      "rendered_file": "step1-live-path.svg",
      "caption": "Step 1: one feed-handler thread owns a channel from the NIC queue to the strategy rings.",
      "alt_text": "A feed-handler thread on an isolated core busy-polls the NIC receive queue for channel 7 line A, checks sequence numbers, decodes venue messages, normalizes them into 64-byte events, updates instrument books, and writes events into one SPSC ring per strategy."
    },
    {
      "source_file": "diagrams/step2-ab-arbitration.dot",
      "rendered_file": "step2-ab-arbitration.svg",
      "caption": "Step 2: each line misses a different packet; arbitration takes the first copy of each sequence number. Only a hole on both lines goes to recovery.",
      "alt_text": "Line A delivers sequences 101, 102, and 104; line B delivers 101, 103, and 104. The arbitrator takes the first copy of each and passes the complete sequence 101 to 104 to decoding and publishing. Only when both lines miss a sequence does it hand the hole to a recovery thread, which requests missing messages from the venue. Trust state is published to strategies as STATUS events."
    },
    {
      "source_file": "diagrams/step3-two-paths.dot",
      "rendered_file": "step3-two-paths.svg",
      "caption": "Step 3: the hot path and the reliable path read the same packets; nothing on the reliable path can slow the feed handlers.",
      "alt_text": "The venue's A and B lines reach a colo switch. Packets go to feed handlers, shared-memory rings, and strategies on the hot path. A mirror or tap sends the same packets to a capture writer that records raw packets with NIC timestamps to local files, which ship later to a central capture store used for replay and research with versioned decoders."
    },
    {
      "source_file": "diagrams/dd1-recovery-states.dot",
      "rendered_file": "dd1-recovery-states.svg",
      "caption": "Deep dive 1: trust state per channel and the transitions between LIVE, RECOVERING, STALE, and SNAPSHOT RESYNC.",
      "alt_text": "A gap on both lines moves a channel from LIVE to RECOVERING, where live packets are buffered and retransmission is requested. A filled hole returns it to LIVE. A refused or slow retransmission, or a full buffer, moves it to SNAPSHOT RESYNC. A missed heartbeat moves LIVE to STALE, and resumed data moves STALE to SNAPSHOT RESYNC. Catching up returns to LIVE."
    }
  ],
