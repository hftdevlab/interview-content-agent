name: Content factory CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ make poppler-utils

      - name: Install project
        run: python -m pip install -e .

      - name: Run complete CI gate
        run: make ci PYTHON=python

      - name: Upload review PDFs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review-pdfs
          path: generated/pdf-preview/*.pdf
          if-no-files-found: error
