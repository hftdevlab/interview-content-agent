<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 384" width="710" height="384" role="img" aria-label="Producer writing a slot then a release store, consumer performing an acquire load then reading the slot, with a synchronises-with edge between the atomics and a happens-before chain spanning both threads">
<!--
  figure: fig-b1-1
  purpose: Show how program order plus one synchronises-with edge composes into happens-before across two threads.
  critical distinction: The edge exists only when the acquire observes the value the release stored.
  forbidden implication: Must not imply the ordinary data is itself atomic, and must not imply the edge exists without the observation.
  generated by build/figures.py — edit there, not here
-->
<defs><marker id="aI" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1f2328"/></marker><marker id="aA" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1a6fb5"/></marker><marker id="aW" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b5501a"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2f7a4f"/></marker><marker id="aM" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker></defs>
<rect width="710" height="384" fill="#ffffff"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <text x="12" y="22" font-size="14" fill="#1f2328" text-anchor="start" font-weight="600">One atomic, correctly ordered, carries an arbitrary amount of ordinary data.</text>
  <rect x="12" y="48" width="320" height="232" rx="2" fill="none" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="26" y="70" font-size="13" fill="#1a6fb5" text-anchor="start" font-weight="600">Producer thread</text>
  <rect x="378" y="48" width="320" height="232" rx="2" fill="none" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="392" y="70" font-size="13" fill="#1a6fb5" text-anchor="start" font-weight="600">Consumer thread</text>
  <rect x="26" y="86" width="292" height="44" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="172" y="106" font-size="12" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">slot = parsed_message;</text>
  <text x="172" y="122" font-size="11" fill="#6b7280" text-anchor="middle">ordinary write, non-atomic</text>
  <path d="M172 132 L172 150" stroke="#6b7280" stroke-width="1.2" fill="none" marker-end="url(#aM)"/>
  <text x="180" y="146" font-size="11" fill="#6b7280" text-anchor="start">sequenced before</text>
  <rect x="26" y="154" width="292" height="50" rx="2" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.5"/>
  <text x="172" y="176" font-size="12" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">ready.store(true, release)</text>
  <text x="172" y="192" font-size="11" fill="#1a6fb5" text-anchor="middle">publishes everything above it</text>
  <rect x="392" y="154" width="292" height="50" rx="2" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.5"/>
  <text x="538" y="176" font-size="12" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">ready.load(acquire)</text>
  <text x="538" y="190" font-size="11" fill="#1a6fb5" text-anchor="middle">if it observes true, it sees all of it</text>
  <path d="M538 208 L538 226" stroke="#6b7280" stroke-width="1.2" fill="none" marker-end="url(#aM)"/>
  <text x="546" y="222" font-size="11" fill="#6b7280" text-anchor="start">sequenced before</text>
  <rect x="392" y="230" width="292" height="44" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="538" y="252" font-size="12" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">use(slot);</text>
  <text x="538" y="268" font-size="11" fill="#6b7280" text-anchor="middle">guaranteed to see the write</text>
  <path d="M320 179 L376 179" stroke="#2f7a4f" stroke-width="2.2" fill="none" marker-end="url(#aO)"/>
  <text x="348" y="166" font-size="11" fill="#2f7a4f" text-anchor="middle">synchronises-with</text>
  <path d="M60 110 C 200 300, 420 300, 520 246" stroke="#2f7a4f" stroke-width="2" fill="none" marker-end="url(#aO)" stroke-dasharray="6 4"/>
  <text x="300" y="308" font-size="12" fill="#2f7a4f" text-anchor="middle">happens-before: the chain making the access race-free</text>
  <line x1="12" y1="330" x2="698" y2="330" stroke="#9aa4b2" stroke-width="1"/>
  <text x="12" y="350" font-size="11" fill="#6b7280" text-anchor="start">Weaken either annotation to relaxed and the chain breaks: no synchronises-with edge, no happens-before, and the</text>
  <text x="12" y="366" font-size="11" fill="#6b7280" text-anchor="start">slot access becomes a data race — undefined behaviour, not a stale read.</text>
</g>
</svg>
