<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 384" width="710" height="384" role="img" aria-label="The order path with pre-trade risk between strategy and gateway, showing exposure incremented before the send and the acknowledgement arriving later, after the order could already have filled">
<!--
  figure: fig-e3-1
  purpose: Show why exposure must be counted before the send rather than on acknowledgement.
  critical distinction: The order is live and fillable during the window between send and acknowledgement.
  forbidden implication: Must not imply the acknowledgement marks the order becoming live, nor that overcounting and undercounting are symmetric errors.
  generated by build/figures.py — edit there, not here
-->
<defs><marker id="aI" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1f2328"/></marker><marker id="aA" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1a6fb5"/></marker><marker id="aW" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b5501a"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2f7a4f"/></marker><marker id="aM" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker></defs>
<rect width="710" height="384" fill="#ffffff"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <text x="12" y="22" font-size="14" fill="#1f2328" text-anchor="start" font-weight="600">The order can fill before the acknowledgement. So count before you send.</text>
  <rect x="12" y="52" width="120" height="44" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="72.0" y="74.0" font-size="13" fill="#1f2328" text-anchor="middle">Strategy</text>
  <text x="72.0" y="88.0" font-size="11" fill="#6b7280" text-anchor="middle">decides</text>
  <path d="M132 74 L158 74" stroke="#1a6fb5" stroke-width="1.6" fill="none" marker-end="url(#aA)"/>
  <rect x="158" y="52" width="180" height="44" rx="2" fill="#fde8d7" stroke="#b5501a" stroke-width="1.5"/>
  <text x="248.0" y="74.0" font-size="13" fill="#1f2328" text-anchor="middle">Pre-trade risk</text>
  <text x="248.0" y="88.0" font-size="11" fill="#6b7280" text-anchor="middle">bounded, on the path</text>
  <path d="M338 74 L364 74" stroke="#1a6fb5" stroke-width="1.6" fill="none" marker-end="url(#aA)"/>
  <rect x="364" y="52" width="140" height="44" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="434.0" y="74.0" font-size="13" fill="#1f2328" text-anchor="middle">Gateway</text>
  <text x="434.0" y="88.0" font-size="11" fill="#6b7280" text-anchor="middle">encode + send</text>
  <path d="M504 74 L530 74" stroke="#1a6fb5" stroke-width="1.6" fill="none" marker-end="url(#aA)"/>
  <rect x="530" y="52" width="158" height="44" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="609.0" y="74.0" font-size="13" fill="#1f2328" text-anchor="middle">Venue</text>
  <text x="609.0" y="88.0" font-size="11" fill="#6b7280" text-anchor="middle">matches</text>
  <rect x="158" y="112" width="180" height="60" rx="2" fill="#dcf0e4" stroke="#2f7a4f" stroke-width="1.5"/>
  <text x="248" y="132" font-size="11" fill="#1f2328" text-anchor="middle">1. check against exposure</text>
  <text x="248" y="150" font-size="11" fill="#2f7a4f" text-anchor="middle">2. INCREMENT exposure</text>
  <path d="M248 110 L248 100" stroke="#2f7a4f" stroke-width="1.4" fill="none" marker-end="url(#aO)"/>
  <path d="M600 100 L600 140 L360 140" stroke="#b5501a" stroke-width="1.8" fill="none" marker-end="url(#aW)"/>
  <text x="430" y="158" font-size="11" fill="#b5501a" text-anchor="middle">ack — arrives LATER</text>
  <rect x="364" y="176" width="324" height="52" rx="2" fill="#fde8d7" stroke="#b5501a" stroke-width="1.5"/>
  <text x="526" y="196" font-size="11" fill="#b5501a" text-anchor="middle">the order is live and can fill during this window</text>
  <text x="526" y="214" font-size="11" fill="#b5501a" text-anchor="middle">counting here leaves it invisible to the limit</text>
  <line x1="12" y1="250" x2="698" y2="250" stroke="#9aa4b2" stroke-width="1"/>
  <text x="12" y="272" font-size="12" fill="#1f2328" text-anchor="start">Under a burst, ten orders in flight are ten uncounted orders, and every check is evaluated against a</text>
  <text x="12" y="289" font-size="12" fill="#1f2328" text-anchor="start">position that ignores them. The limit permits all ten. Nothing errors; you find out from the end-of-day</text>
  <text x="12" y="306" font-size="12" fill="#1f2328" text-anchor="start">position.</text>
  <rect x="12" y="326" width="336" height="44" rx="2" fill="#dcf0e4" stroke="#2f7a4f" stroke-width="1.5"/>
  <text x="180" y="346" font-size="11" fill="#2f7a4f" text-anchor="middle">overcount: reject an order you could have allowed</text>
  <text x="180" y="362" font-size="11" fill="#6b7280" text-anchor="middle">cost = opportunity</text>
  <rect x="360" y="326" width="328" height="44" rx="2" fill="#fde8d7" stroke="#b5501a" stroke-width="1.5"/>
  <text x="524" y="346" font-size="11" fill="#b5501a" text-anchor="middle">undercount: permit an order you should have</text>
  <text x="524" y="359" font-size="11" fill="#b5501a" text-anchor="middle">blocked</text>
  <text x="524" y="362" font-size="11" fill="#6b7280" text-anchor="middle">cost = money</text>
</g>
