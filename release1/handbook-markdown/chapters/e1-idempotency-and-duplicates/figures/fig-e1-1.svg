<rect width="710" height="444" fill="#ffffff"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <text x="12" y="22" font-size="14" fill="#1f2328" text-anchor="start" font-weight="600">You cannot tell which of these happened. The identity makes it not matter.</text>
  <text x="12" y="52" font-size="12" fill="#b5501a" text-anchor="start">Case A — the request was lost</text>
  <rect x="12" y="64" width="120" height="34" rx="2" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.5"/>
  <text x="72" y="85" font-size="11" fill="#6b7280" text-anchor="middle">your gateway</text>
  <rect x="566" y="64" width="120" height="34" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="626" y="85" font-size="11" fill="#6b7280" text-anchor="middle">venue</text>
  <path d="M132 78 L340 78" stroke="#b5501a" stroke-width="1.6" fill="none" marker-end="url(#aW)"/>
  <text x="352" y="82" font-size="11" fill="#b5501a">X lost</text>
  <text x="12" y="116" font-size="11" fill="#6b7280" text-anchor="start">no order exists</text>
  <text x="12" y="148" font-size="12" fill="#b5501a" text-anchor="start">Case B — the request arrived; the response was lost</text>
  <rect x="12" y="160" width="120" height="34" rx="2" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.5"/>
  <text x="72" y="181" font-size="11" fill="#6b7280" text-anchor="middle">your gateway</text>
  <rect x="566" y="160" width="120" height="34" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="626" y="181" font-size="11" fill="#6b7280" text-anchor="middle">venue</text>
  <path d="M132 172 L564 172" stroke="#2f7a4f" stroke-width="1.6" fill="none" marker-end="url(#aO)"/>
  <path d="M564 190 L360 190" stroke="#b5501a" stroke-width="1.6" fill="none" marker-end="url(#aW)"/>
  <text x="300" y="194" font-size="11" fill="#b5501a">X lost</text>
  <text x="12" y="212" font-size="11" fill="#b5501a" text-anchor="start">the order EXISTS and may already have filled</text>
  <rect x="150" y="232" width="412" height="34" rx="2" fill="#fde8d7" stroke="#b5501a" stroke-width="1.5"/>
  <text x="356" y="254" font-size="12" fill="#1f2328" text-anchor="middle">From the gateway both look identical: silence.</text>
  <line x1="12" y1="282" x2="698" y2="282" stroke="#9aa4b2" stroke-width="1"/>
  <text x="12" y="306" font-size="12" fill="#2f7a4f" text-anchor="start">Retry carrying the SAME client order ID</text>
  <rect x="12" y="318" width="120" height="34" rx="2" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.5"/>
  <text x="72" y="339" font-size="11" fill="#6b7280" text-anchor="middle">your gateway</text>
  <rect x="566" y="318" width="120" height="34" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="626" y="339" font-size="11" fill="#6b7280" text-anchor="middle">venue</text>
  <path d="M132 330 L564 330" stroke="#2f7a4f" stroke-width="1.6" fill="none" marker-end="url(#aO)"/>
  <text x="348" y="324" font-size="12" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">ORD-20260807-GW3-184213</text>
  <path d="M564 356 L134 356" stroke="#2f7a4f" stroke-width="1.6" fill="none" marker-end="url(#aO)"/>
  <text x="348" y="372" font-size="11" fill="#2f7a4f" text-anchor="middle">Case A: accepted — one order. Case B: rejected as duplicate — still one order.</text>
  <text x="12" y="404" font-size="12" fill="#1f2328" text-anchor="start">The rejection is the mechanism working, not an error. Count it and carry on. Allocate a NEW id for the</text>
  <text x="12" y="421" font-size="12" fill="#1f2328" text-anchor="start">retry and you have built the failure you were avoiding.</text>
</g>
</svg>
