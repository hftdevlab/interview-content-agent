<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 444" width="710" height="444" role="img" aria-label="Two indistinguishable failure cases — a lost request and a lost response — followed by a retry carrying the same client order ID which converges on one order in both cases">
<!--
  figure: fig-e1-1
  purpose: Show that the client cannot distinguish the two failures, and that a stable identity makes both converge on the same end state.
  critical distinction: A duplicate rejection is the mechanism succeeding, not an error.
  forbidden implication: Must not imply the client can determine which case occurred, nor that a fresh identity would be safe.
  generated by build/figures.py — edit there, not here
-->
