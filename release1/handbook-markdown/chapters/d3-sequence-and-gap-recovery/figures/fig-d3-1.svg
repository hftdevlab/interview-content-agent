<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 306" width="710" height="306" role="img" aria-label="Recovery state machine cycling through Synchronised, Recovering and Draining, under a banner stating the live socket is read in every state, with a failure edge from Draining back to Recovering">
<!--
  figure: fig-d3-1
  purpose: Show that live reception continues in every state and that recovery can fail and repeat.
  critical distinction: Buffering continues throughout; the states describe the book's trust, not whether the socket is being read.
  forbidden implication: Must not suggest recovery blocks live reception, and must not show a single linear path implying a second gap is impossible.
  generated by build/figures.py — edit there, not here
-->
<defs><marker id="aI" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1f2328"/></marker><marker id="aA" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1a6fb5"/></marker><marker id="aW" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b5501a"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2f7a4f"/></marker><marker id="aM" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker></defs>
<rect width="710" height="306" fill="#ffffff"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <text x="12" y="22" font-size="14" fill="#1f2328" text-anchor="start" font-weight="600">Recovery runs alongside live reception. It never replaces it.</text>
  <rect x="12" y="44" width="676" height="40" rx="2" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.5"/>
  <text x="350" y="64" font-size="12" fill="#1a6fb5" text-anchor="middle">LIVE SOCKET IS READ CONTINUOUSLY IN EVERY STATE BELOW</text>
  <text x="350" y="78" font-size="11" fill="#1a6fb5" text-anchor="middle">messages that cannot be applied are buffered, not dropped</text>
  <rect x="40" y="120" width="150" height="54" rx="2" fill="#dcf0e4" stroke="#2f7a4f" stroke-width="1.5"/>
  <text x="115.0" y="147.0" font-size="13" fill="#1f2328" text-anchor="middle">Synchronised</text>
  <text x="115.0" y="161.0" font-size="11" fill="#6b7280" text-anchor="middle">book is trusted</text>
  <path d="M190 147 L250 147" stroke="#b5501a" stroke-width="1.6" fill="none" marker-end="url(#aW)"/>
  <text x="220" y="138" font-size="11" fill="#b5501a" text-anchor="middle">gap detected</text>
  <rect x="250" y="120" width="150" height="54" rx="2" fill="#fde8d7" stroke="#b5501a" stroke-width="1.5"/>
  <text x="325.0" y="147.0" font-size="13" fill="#1f2328" text-anchor="middle">Recovering</text>
  <text x="325.0" y="161.0" font-size="11" fill="#6b7280" text-anchor="middle">book UNTRUSTED</text>
  <path d="M400 147 L460 147" stroke="#1f2328" stroke-width="1.4" fill="none" marker-end="url(#aI)"/>
  <text x="430" y="138" font-size="11" fill="#6b7280" text-anchor="middle">snapshot or</text>
  <text x="430" y="166" font-size="11" fill="#6b7280" text-anchor="middle">retransmission</text>
  <rect x="460" y="120" width="150" height="54" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="535.0" y="147.0" font-size="13" fill="#1f2328" text-anchor="middle">Draining</text>
  <text x="535.0" y="161.0" font-size="11" fill="#6b7280" text-anchor="middle">apply buffered</text>
  <path d="M535 118 L535 100 L115 100 L115 118" stroke="#2f7a4f" stroke-width="1.8" fill="none" marker-end="url(#aO)"/>
  <text x="325" y="94" font-size="11" fill="#2f7a4f" text-anchor="middle">buffer contiguous and empty -&gt; trusted again</text>
  <path d="M535 176 L535 210 L325 210 L325 176" stroke="#b5501a" stroke-width="1.8" fill="none" marker-end="url(#aW)"/>
  <text x="400" y="226" font-size="11" fill="#b5501a" text-anchor="middle">buffer NOT contiguous — another gap. Recovery can fail.</text>
  <line x1="12" y1="250" x2="698" y2="250" stroke="#9aa4b2" stroke-width="1"/>
  <text x="12" y="272" font-size="11" fill="#6b7280" text-anchor="start">A design that stops reading the socket to recover turns a three-message gap into a lost session: the kernel</text>
  <text x="12" y="288" font-size="11" fill="#6b7280" text-anchor="start">receive buffer fills while you wait.</text>
</g>
</svg>
