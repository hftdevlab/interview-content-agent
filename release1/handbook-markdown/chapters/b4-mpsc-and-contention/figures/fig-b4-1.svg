<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 408" width="710" height="408" role="img" aria-label="Five ring slots where one is claimed but not written while the shared index has advanced past it, and below the same slots each carrying their own sequence marker">
<!--
  figure: fig-b4-1
  purpose: Show that a shared claim index describes claims rather than writes, and that per-slot readiness is what restores the consumer's inference.
  critical distinction: Claiming and writing are two separate steps once there is more than one producer.
  forbidden implication: Must not imply fetch_add alone is sufficient, and must not imply the consumer can detect the problem from the index.
  generated by build/figures.py — edit there, not here
-->
<defs><marker id="aI" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1f2328"/></marker><marker id="aA" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1a6fb5"/></marker><marker id="aW" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b5501a"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2f7a4f"/></marker><marker id="aM" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker></defs>
<rect width="710" height="408" fill="#ffffff"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <text x="12" y="22" font-size="14" fill="#1f2328" text-anchor="start" font-weight="600">With one producer, an advanced index meant a written slot. With two, it does not.</text>
  <text x="12" y="50" font-size="13" fill="#b5501a" text-anchor="start">The broken design: consumer infers readiness from the shared index</text>
  <rect x="12" y="62" width="124" height="50" rx="2" fill="#dcf0e4" stroke="#2f7a4f" stroke-width="1.5"/>
  <text x="74" y="84" font-size="12" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">slot 4</text>
  <text x="74" y="100" font-size="11" fill="#6b7280" text-anchor="middle">written</text>
  <rect x="142" y="62" width="124" height="50" rx="2" fill="#dcf0e4" stroke="#2f7a4f" stroke-width="1.5"/>
  <text x="204" y="84" font-size="12" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">slot 5</text>
  <text x="204" y="100" font-size="11" fill="#6b7280" text-anchor="middle">written</text>
  <rect x="272" y="62" width="124" height="50" rx="2" fill="#fde8d7" stroke="#b5501a" stroke-width="1.5"/>
  <text x="334" y="84" font-size="12" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">slot 6</text>
  <text x="334" y="100" font-size="11" fill="#b5501a" text-anchor="middle">claimed, NOT written</text>
  <rect x="402" y="62" width="124" height="50" rx="2" fill="#dcf0e4" stroke="#2f7a4f" stroke-width="1.5"/>
  <text x="464" y="84" font-size="12" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">slot 7</text>
  <text x="464" y="100" font-size="11" fill="#6b7280" text-anchor="middle">written</text>
  <rect x="532" y="62" width="124" height="50" rx="2" fill="#ffffff" stroke="#9aa4b2" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="594" y="84" font-size="12" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">slot 8</text>
  <text x="594" y="100" font-size="11" fill="#6b7280" text-anchor="middle">free</text>
  <path d="M150 140 L150 116" stroke="#b5501a" stroke-width="1.6" fill="none" marker-end="url(#aW)"/>
  <text x="150" y="158" font-size="11" fill="#b5501a" text-anchor="middle">producer A: fetch_add returned 6,</text>
  <text x="150" y="174" font-size="11" fill="#b5501a" text-anchor="middle">then A was descheduled</text>
  <path d="M410 140 L410 116" stroke="#1a6fb5" stroke-width="1.6" fill="none" marker-end="url(#aA)"/>
  <text x="410" y="158" font-size="11" fill="#1a6fb5" text-anchor="middle">producer B: claimed 7 and</text>
  <text x="410" y="174" font-size="11" fill="#1a6fb5" text-anchor="middle">finished writing it</text>
  <path d="M600 44 L600 60" stroke="#1f2328" stroke-width="1.6" fill="none" marker-end="url(#aI)"/>
  <text x="600" y="36" font-size="11" fill="#6b7280" text-anchor="middle">head = 9</text>
  <rect x="12" y="192" width="676" height="46" rx="2" fill="#fde8d7" stroke="#b5501a" stroke-width="1.5"/>
  <text x="350" y="210" font-size="12" fill="#1f2328" text-anchor="middle">Consumer sees head past slot 6, reads slot 6, and gets stale data from an earlier lap. Nothing</text>
  <text x="350" y="226" font-size="12" fill="#1f2328" text-anchor="middle">crashes.</text>
  <line x1="12" y1="254" x2="698" y2="254" stroke="#9aa4b2" stroke-width="1"/>
  <text x="12" y="278" font-size="13" fill="#2f7a4f" text-anchor="start">The fix: readiness lives in the slot, not in the index</text>
  <rect x="12" y="290" width="124" height="58" rx="2" fill="#dcf0e4" stroke="#2f7a4f" stroke-width="1.5"/>
  <text x="74" y="310" font-size="12" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">slot 4</text>
  <line x1="20" y1="318" x2="128" y2="318" stroke="#9aa4b2" stroke-width="1"/>
  <text x="74" y="336" font-size="11" fill="#2f7a4f" text-anchor="middle">seq = 5</text>
  <rect x="142" y="290" width="124" height="58" rx="2" fill="#dcf0e4" stroke="#2f7a4f" stroke-width="1.5"/>
  <text x="204" y="310" font-size="12" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">slot 5</text>
  <line x1="150" y1="318" x2="258" y2="318" stroke="#9aa4b2" stroke-width="1"/>
  <text x="204" y="336" font-size="11" fill="#2f7a4f" text-anchor="middle">seq = 6</text>
  <rect x="272" y="290" width="124" height="58" rx="2" fill="#fde8d7" stroke="#b5501a" stroke-width="1.5"/>
  <text x="334" y="310" font-size="12" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">slot 6</text>
  <line x1="280" y1="318" x2="388" y2="318" stroke="#9aa4b2" stroke-width="1"/>
  <text x="334" y="336" font-size="11" fill="#b5501a" text-anchor="middle">seq = old</text>
  <rect x="402" y="290" width="124" height="58" rx="2" fill="#dcf0e4" stroke="#2f7a4f" stroke-width="1.5"/>
  <text x="464" y="310" font-size="12" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">slot 7</text>
  <line x1="410" y1="318" x2="518" y2="318" stroke="#9aa4b2" stroke-width="1"/>
  <text x="464" y="336" font-size="11" fill="#2f7a4f" text-anchor="middle">seq = 8</text>
  <rect x="532" y="290" width="124" height="58" rx="2" fill="#dcf0e4" stroke="#2f7a4f" stroke-width="1.5"/>
  <text x="594" y="310" font-size="12" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">slot 8</text>
  <line x1="540" y1="318" x2="648" y2="318" stroke="#9aa4b2" stroke-width="1"/>
  <text x="594" y="336" font-size="11" fill="#2f7a4f" text-anchor="middle">seq = 9</text>
  <text x="12" y="372" font-size="11" fill="#6b7280" text-anchor="start">Producer: claim the slot, write the payload, THEN release-store the slot's sequence. The consumer tests the</text>
  <text x="12" y="388" font-size="11" fill="#6b7280" text-anchor="start">slot's own marker, so a claimed-but-unwritten slot is invisible to it.</text>
</g>
</svg>
