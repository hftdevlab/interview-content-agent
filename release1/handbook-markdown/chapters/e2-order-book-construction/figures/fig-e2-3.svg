  <line x1="12" y1="320" x2="698" y2="320" stroke="#9aa4b2" stroke-width="1"/>
  <text x="12" y="344" font-size="12" fill="#b5501a" text-anchor="start">orders[] — order id to pool index</text>
  <rect x="12" y="356" width="320" height="34" rx="2" fill="#fde8d7" stroke="#b5501a" stroke-width="1.5"/>
  <text x="172" y="377" font-size="11" fill="#1f2328" text-anchor="middle">8907 -&gt; pool slot 41</text>
  <text x="352" y="370" font-size="11" fill="#b5501a" text-anchor="start">this is what makes cancel O(1): find the node without</text>
  <text x="352" y="384" font-size="11" fill="#b5501a" text-anchor="start">walking the list</text>
  <text x="12" y="410" font-size="12" fill="#1f2328" text-anchor="start">Add appends at the tail. Cancel unlinks in place. A size reduction edits the node and KEEPS queue</text>
  <text x="12" y="427" font-size="12" fill="#1f2328" text-anchor="start">position; a price change or size increase is a cancel and a new order at the back of the queue.</text>
