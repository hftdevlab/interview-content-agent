<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 464" width="710" height="464" role="img" aria-label="A price ladder whose occupied levels hold head and tail indices into an order pool, the doubly-linked FIFO list of orders at one level, and an order-id index mapping ids to pool slots">
<!--
  figure: fig-e2-3
  purpose: Show the three structures an order-by-order book needs and why each exists.
  critical distinction: The order-id index is what makes cancellation constant time; the doubly-linked list is what makes the unlink constant time.
  forbidden implication: Must not imply orders are stored inside the level, nor that pointers are used where indices are correct.
  generated by build/figures.py — edit there, not here
-->
