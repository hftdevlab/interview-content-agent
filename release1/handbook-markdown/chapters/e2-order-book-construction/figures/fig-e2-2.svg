<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 368" width="710" height="368" role="img" aria-label="Three market-data detail levels side by side: L1 showing only the best price and size, L2 showing aggregated size per price level, and L3 showing individual orders within each level">
<!--
  figure: fig-e2-2
  purpose: Show what each detail level does and does not let you see, and that aggregation runs only one way.
  critical distinction: L2 aggregates away the individual orders, so queue position is unavailable from it at any cost.
  forbidden implication: Must not imply L1 or L2 can be expanded into L3, nor that L3 is simply a better feed rather than a more expensive one.
  generated by build/figures.py — edit there, not here
-->
<defs><marker id="aI" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1f2328"/></marker><marker id="aA" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1a6fb5"/></marker><marker id="aW" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b5501a"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2f7a4f"/></marker><marker id="aM" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker></defs>
<rect width="710" height="368" fill="#ffffff"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <text x="12" y="22" font-size="14" fill="#1f2328" text-anchor="start" font-weight="600">Three levels of detail. Each is derivable from the one below it, never the reverse.</text>
  <rect x="12" y="44" width="218" height="30" rx="2" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.5"/>
  <text x="121" y="64" font-size="12" fill="#1f2328" text-anchor="middle">L1 — top of book</text>
  <text x="121" y="88" font-size="11" fill="#6b7280" text-anchor="middle">best bid and offer only</text>
  <rect x="246" y="44" width="218" height="30" rx="2" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.5"/>
  <text x="355" y="64" font-size="12" fill="#1f2328" text-anchor="middle">L2 — aggregated depth</text>
  <text x="355" y="88" font-size="11" fill="#6b7280" text-anchor="middle">size per price level</text>
  <rect x="480" y="44" width="218" height="30" rx="2" fill="#dcf0e4" stroke="#2f7a4f" stroke-width="1.5"/>
  <text x="589" y="64" font-size="12" fill="#1f2328" text-anchor="middle">L3 — order by order</text>
  <text x="589" y="88" font-size="11" fill="#6b7280" text-anchor="middle">every resting order</text>
  <rect x="12" y="104" width="218" height="34" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="121" y="124" font-size="12" fill="#1f2328" text-anchor="middle">178.42 x 4,300</text>
  <text x="121" y="152" font-size="11" fill="#6b7280" text-anchor="middle">one number per side. You cannot</text>
  <text x="121" y="165" font-size="11" fill="#6b7280" text-anchor="middle">tell whether that is one order or</text>
  <text x="121" y="178" font-size="11" fill="#6b7280" text-anchor="middle">forty.</text>
  <rect x="246" y="104" width="218" height="26" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="300" y="122" font-size="11" fill="#1f2328" text-anchor="middle">178.42</text>
  <text x="410" y="122" font-size="11" fill="#6b7280" text-anchor="middle">4,300</text>
  <rect x="246" y="132" width="218" height="26" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="300" y="150" font-size="11" fill="#1f2328" text-anchor="middle">178.41</text>
  <text x="410" y="150" font-size="11" fill="#6b7280" text-anchor="middle">2,100</text>
  <rect x="246" y="160" width="218" height="26" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="300" y="178" font-size="11" fill="#1f2328" text-anchor="middle">178.40</text>
  <text x="410" y="178" font-size="11" fill="#6b7280" text-anchor="middle">6,900</text>
  <text x="355" y="202" font-size="11" fill="#6b7280" text-anchor="middle">depth by price. Enough for most</text>
  <text x="355" y="215" font-size="11" fill="#6b7280" text-anchor="middle">strategies; still no visibility</text>
  <text x="355" y="228" font-size="11" fill="#6b7280" text-anchor="middle">into the queue.</text>
  <rect x="480" y="104" width="218" height="24" rx="2" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.5"/>
  <text x="589" y="120" font-size="11" fill="#1f2328" text-anchor="middle">178.42</text>
  <rect x="496" y="130" width="202" height="22" rx="2" fill="#dcf0e4" stroke="#2f7a4f" stroke-width="1.5"/>
  <text x="560" y="145" font-size="10.5" fill="#1f2328" text-anchor="middle">order 1</text>
  <text x="660" y="145" font-size="10.5" fill="#6b7280" text-anchor="middle">1,200</text>
  <rect x="496" y="154" width="202" height="22" rx="2" fill="#dcf0e4" stroke="#2f7a4f" stroke-width="1.5"/>
  <text x="560" y="169" font-size="10.5" fill="#1f2328" text-anchor="middle">order 2</text>
  <text x="660" y="169" font-size="10.5" fill="#6b7280" text-anchor="middle">800</text>
  <rect x="496" y="178" width="202" height="22" rx="2" fill="#dcf0e4" stroke="#2f7a4f" stroke-width="1.5"/>
  <text x="560" y="193" font-size="10.5" fill="#1f2328" text-anchor="middle">order 3</text>
  <text x="660" y="193" font-size="10.5" fill="#6b7280" text-anchor="middle">2,300</text>
  <rect x="480" y="206" width="218" height="24" rx="2" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.5"/>
  <text x="589" y="222" font-size="11" fill="#1f2328" text-anchor="middle">178.41</text>
  <rect x="496" y="232" width="202" height="22" rx="2" fill="#dcf0e4" stroke="#2f7a4f" stroke-width="1.5"/>
  <text x="560" y="247" font-size="10.5" fill="#1f2328" text-anchor="middle">order 1</text>
  <text x="660" y="247" font-size="10.5" fill="#6b7280" text-anchor="middle">2,100</text>
  <text x="589" y="252" font-size="11" fill="#2f7a4f" text-anchor="middle">individual orders in FIFO order,</text>
  <text x="589" y="265" font-size="11" fill="#2f7a4f" text-anchor="middle">so you can compute where YOUR</text>
  <text x="589" y="278" font-size="11" fill="#2f7a4f" text-anchor="middle">order sits in the queue</text>
  <line x1="12" y1="296" x2="698" y2="296" stroke="#9aa4b2" stroke-width="1"/>
  <text x="12" y="318" font-size="12" fill="#1f2328" text-anchor="start">L3 -&gt; L2 -&gt; L1 by aggregation. The reverse is impossible: no amount of L2 tells you how the size at a</text>
  <text x="12" y="335" font-size="12" fill="#1f2328" text-anchor="start">level is divided between orders, and queue position is the whole point for some strategies. L3 costs</text>
  <text x="12" y="352" font-size="12" fill="#1f2328" text-anchor="start">far more messages and far more state.</text>
</g>
</svg>
