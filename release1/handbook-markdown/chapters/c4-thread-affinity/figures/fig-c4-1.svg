<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 348" width="710" height="348" role="img" aria-label="Four physical cores each with two logical CPUs; one core has a pinned thread with its sibling idle, another has a pinned thread whose sibling is running other work">
<!--
  figure: fig-c4-1
  purpose: Show that a logical CPU is half a physical core, and that pinning does not stop the sibling being used.
  critical distinction: Two consecutive logical CPU numbers may be one physical core's two threads.
  forbidden implication: Must not imply logical CPU numbering is portable, and must not imply pinning alone dedicates a core.
  generated by build/figures.py — edit there, not here
-->
<defs><marker id="aI" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1f2328"/></marker><marker id="aA" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1a6fb5"/></marker><marker id="aW" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b5501a"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2f7a4f"/></marker><marker id="aM" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker></defs>
<rect width="710" height="348" fill="#ffffff"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <text x="12" y="22" font-size="14" fill="#1f2328" text-anchor="start" font-weight="600">Pinning says where your thread runs. It says nothing about what else runs there.</text>
  <rect x="12" y="44" width="676" height="150" rx="2" fill="none" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="26" y="66" font-size="13" fill="#1f2328" text-anchor="start">One socket, four physical cores, SMT enabled</text>
  <rect x="26" y="78" width="156" height="96" rx="2" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.5"/>
  <text x="104" y="98" font-size="13" fill="#1f2328" text-anchor="middle">core 0</text>
  <text x="104" y="114" font-size="11" fill="#6b7280" text-anchor="middle">cpu 0 / cpu 4</text>
  <rect x="34" y="124" width="68" height="42" rx="2" fill="#dcf0e4" stroke="#2f7a4f" stroke-width="1.5"/>
  <rect x="106" y="124" width="68" height="42" rx="2" fill="#ffffff" stroke="#9aa4b2" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="68" y="150" font-size="11" fill="#2f7a4f" text-anchor="middle">feed</text>
  <text x="140" y="150" font-size="11" fill="#6b7280" text-anchor="middle">idle</text>
  <rect x="190" y="78" width="156" height="96" rx="2" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.5"/>
  <text x="268" y="98" font-size="13" fill="#1f2328" text-anchor="middle">core 1</text>
  <text x="268" y="114" font-size="11" fill="#6b7280" text-anchor="middle">cpu 1 / cpu 5</text>
  <rect x="198" y="124" width="68" height="42" rx="2" fill="#fde8d7" stroke="#b5501a" stroke-width="1.5"/>
  <rect x="270" y="124" width="68" height="42" rx="2" fill="#ffffff" stroke="#9aa4b2" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="232" y="150" font-size="11" fill="#b5501a" text-anchor="middle">strategy</text>
  <text x="304" y="150" font-size="11" fill="#b5501a" text-anchor="middle">OTHER WORK</text>
  <rect x="354" y="78" width="156" height="96" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="432" y="98" font-size="13" fill="#1f2328" text-anchor="middle">core 2</text>
  <text x="432" y="114" font-size="11" fill="#6b7280" text-anchor="middle">cpu 2 / cpu 6</text>
  <rect x="362" y="124" width="68" height="42" rx="2" fill="#ffffff" stroke="#9aa4b2" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="434" y="124" width="68" height="42" rx="2" fill="#ffffff" stroke="#9aa4b2" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="396" y="150" font-size="11" fill="#6b7280" text-anchor="middle"></text>
  <text x="468" y="150" font-size="11" fill="#6b7280" text-anchor="middle"></text>
  <rect x="518" y="78" width="156" height="96" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="596" y="98" font-size="13" fill="#1f2328" text-anchor="middle">core 3</text>
  <text x="596" y="114" font-size="11" fill="#6b7280" text-anchor="middle">cpu 3 / cpu 7</text>
  <rect x="526" y="124" width="68" height="42" rx="2" fill="#ffffff" stroke="#9aa4b2" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="598" y="124" width="68" height="42" rx="2" fill="#ffffff" stroke="#9aa4b2" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="560" y="150" font-size="11" fill="#6b7280" text-anchor="middle"></text>
  <text x="632" y="150" font-size="11" fill="#6b7280" text-anchor="middle"></text>
  <text x="26" y="190" font-size="11" fill="#6b7280" text-anchor="start">the two logical CPUs of one physical core share its execution units, L1 and L2</text>
  <rect x="12" y="206" width="338" height="66" rx="2" fill="#dcf0e4" stroke="#2f7a4f" stroke-width="1.5"/>
  <text x="181" y="228" font-size="13" fill="#1f2328" text-anchor="middle">core 0 — done properly</text>
  <text x="181" y="246" font-size="11" fill="#2f7a4f" text-anchor="middle">thread pinned, sibling left idle,</text>
  <text x="181" y="260" font-size="11" fill="#2f7a4f" text-anchor="middle">interrupts routed elsewhere</text>
  <rect x="360" y="206" width="328" height="66" rx="2" fill="#fde8d7" stroke="#b5501a" stroke-width="1.5"/>
  <text x="524" y="226" font-size="13" fill="#1f2328" text-anchor="middle">core 1 — pinned, and still jittery</text>
  <text x="524" y="244" font-size="11" fill="#b5501a" text-anchor="middle">the sibling is running other work, so the physical</text>
  <text x="524" y="258" font-size="11" fill="#b5501a" text-anchor="middle">core is shared. Pinning did not prevent it.</text>
  <line x1="12" y1="290" x2="698" y2="290" stroke="#9aa4b2" stroke-width="1"/>
  <text x="12" y="312" font-size="11" fill="#6b7280" text-anchor="start">Logical CPU numbering does not map predictably to physical cores. Read the topology from the machine; never</text>
  <text x="12" y="328" font-size="11" fill="#6b7280" text-anchor="start">assume cpu 0 and cpu 1 are different cores.</text>
</g>
</svg>
