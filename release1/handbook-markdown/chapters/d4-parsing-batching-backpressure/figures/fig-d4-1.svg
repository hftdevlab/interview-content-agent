<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 320" width="710" height="320" role="img" aria-label="Receive path from NIC ring through kernel socket buffer to the handler and its outbound queue, with three separate drop points each labelled with its counter and its meaning">
<!--
  figure: fig-d4-1
  purpose: Show that drops occur at three distinct stages with different causes and different fixes.
  critical distinction: Each drop point has its own counter; the symptom is identical but the diagnosis is not.
  forbidden implication: Must not imply drops are a single phenomenon, nor that a larger queue addresses all three.
  generated by build/figures.py — edit there, not here
-->
<defs><marker id="aI" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1f2328"/></marker><marker id="aA" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1a6fb5"/></marker><marker id="aW" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b5501a"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2f7a4f"/></marker><marker id="aM" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker></defs>
<rect width="710" height="320" fill="#ffffff"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <text x="12" y="22" font-size="14" fill="#1f2328" text-anchor="start" font-weight="600">Three places a message dies. Three counters. One symptom.</text>
  <rect x="12" y="52" width="168" height="52" rx="2" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.5"/>
  <text x="96.0" y="78.0" font-size="13" fill="#1f2328" text-anchor="middle">NIC ring</text>
  <text x="96.0" y="92.0" font-size="11" fill="#6b7280" text-anchor="middle">card DMAs here</text>
  <rect x="196" y="52" width="184" height="52" rx="2" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.5"/>
  <text x="288.0" y="78.0" font-size="13" fill="#1f2328" text-anchor="middle">Kernel socket buffer</text>
  <text x="288.0" y="92.0" font-size="11" fill="#6b7280" text-anchor="middle">waits for your read</text>
  <rect x="396" y="52" width="144" height="52" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="468.0" y="78.0" font-size="13" fill="#1f2328" text-anchor="middle">Your handler</text>
  <text x="468.0" y="92.0" font-size="11" fill="#6b7280" text-anchor="middle">parse, build book</text>
  <rect x="556" y="52" width="142" height="52" rx="2" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.5"/>
  <text x="627.0" y="78.0" font-size="13" fill="#1f2328" text-anchor="middle">Strategy queue</text>
  <text x="627.0" y="92.0" font-size="11" fill="#6b7280" text-anchor="middle">the handoff</text>
  <path d="M180 78 L194 78" stroke="#1a6fb5" stroke-width="1.6" fill="none" marker-end="url(#aA)"/>
  <path d="M380 78 L394 78" stroke="#1a6fb5" stroke-width="1.6" fill="none" marker-end="url(#aA)"/>
  <path d="M540 78 L554 78" stroke="#1a6fb5" stroke-width="1.6" fill="none" marker-end="url(#aA)"/>
  <path d="M96 112 L96 140" stroke="#b5501a" stroke-width="1.6" fill="none" marker-end="url(#aW)"/>
  <rect x="10" y="144" width="172" height="74" rx="2" fill="#fde8d7" stroke="#b5501a" stroke-width="1.5"/>
  <text x="96" y="164" font-size="12" fill="#1f2328" text-anchor="middle">ring overrun</text>
  <text x="96" y="182" font-size="11" fill="#b5501a" text-anchor="middle">kernel too slow to service</text>
  <text x="96" y="195" font-size="11" fill="#b5501a" text-anchor="middle">it</text>
  <text x="96" y="210" font-size="11" fill="#6b7280" text-anchor="middle">interrupts / affinity</text>
  <path d="M300 112 L300 140" stroke="#b5501a" stroke-width="1.6" fill="none" marker-end="url(#aW)"/>
  <rect x="214" y="144" width="172" height="74" rx="2" fill="#fde8d7" stroke="#b5501a" stroke-width="1.5"/>
  <text x="300" y="164" font-size="12" fill="#1f2328" text-anchor="middle">socket recv error</text>
  <text x="300" y="182" font-size="11" fill="#b5501a" text-anchor="middle">YOUR APP too slow to drain</text>
  <text x="300" y="195" font-size="11" fill="#b5501a" text-anchor="middle">it</text>
  <text x="300" y="210" font-size="11" fill="#6b7280" text-anchor="middle">most common by far</text>
  <path d="M604 112 L604 140" stroke="#b5501a" stroke-width="1.6" fill="none" marker-end="url(#aW)"/>
  <rect x="518" y="144" width="172" height="74" rx="2" fill="#fde8d7" stroke="#b5501a" stroke-width="1.5"/>
  <text x="604" y="164" font-size="12" fill="#1f2328" text-anchor="middle">queue push fail</text>
  <text x="604" y="182" font-size="11" fill="#b5501a" text-anchor="middle">downstream too slow</text>
  <text x="604" y="210" font-size="11" fill="#6b7280" text-anchor="middle">the one you control</text>
  <line x1="12" y1="236" x2="698" y2="236" stroke="#9aa4b2" stroke-width="1"/>
  <text x="12" y="258" font-size="12" fill="#1f2328" text-anchor="start">Sum these into one number and you have destroyed the only information that says where to look: an</text>
  <text x="12" y="275" font-size="12" fill="#1f2328" text-anchor="start">interrupt-routing problem, an application-speed problem, and a queue-sizing problem produce identical</text>
  <text x="12" y="292" font-size="12" fill="#1f2328" text-anchor="start">symptoms and need entirely different fixes.</text>
</g>
</svg>
