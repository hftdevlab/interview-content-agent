<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 418" width="710" height="418" role="img" aria-label="A UDP stream where a lost packet leaves a detectable gap while later packets are delivered, compared with a TCP stream where later segments arrive but are held undelivered until the lost one is retransmitted">
<!--
  figure: fig-d4-2
  purpose: Show that head-of-line blocking converts a detectable gap into an undetectable stall.
  critical distinction: The held segments have arrived; the kernel withholds them to preserve ordering.
  forbidden implication: Must not imply TCP loses the data, nor that the application can observe the stall as anything other than silence.
  generated by build/figures.py — edit there, not here
-->
<defs><marker id="aI" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1f2328"/></marker><marker id="aA" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1a6fb5"/></marker><marker id="aW" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b5501a"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2f7a4f"/></marker><marker id="aM" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker></defs>
<rect width="710" height="418" fill="#ffffff"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <text x="12" y="22" font-size="14" fill="#1f2328" text-anchor="start" font-weight="600">The same loss, two protocols, two very different failures.</text>
  <text x="12" y="52" font-size="13" fill="#2f7a4f" text-anchor="start">UDP: the loss is visible and bounded</text>
  <line x1="40" y1="104" x2="690" y2="104" stroke="#9aa4b2" stroke-width="1.2"/>
  <circle cx="100" cy="104" r="7" fill="#2f7a4f"/>
  <text x="100" y="88" font-size="11" fill="#6b7280" text-anchor="middle">4</text>
  <circle cx="190" cy="104" r="7" fill="none" stroke="#b5501a" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="190" y="88" font-size="11" fill="#b5501a" text-anchor="middle">lost</text>
  <circle cx="280" cy="104" r="7" fill="#2f7a4f"/>
  <text x="280" y="88" font-size="11" fill="#6b7280" text-anchor="middle">6</text>
  <circle cx="370" cy="104" r="7" fill="#2f7a4f"/>
  <text x="370" y="88" font-size="11" fill="#6b7280" text-anchor="middle">7</text>
  <circle cx="460" cy="104" r="7" fill="#2f7a4f"/>
  <text x="460" y="88" font-size="11" fill="#6b7280" text-anchor="middle">8</text>
  <circle cx="550" cy="104" r="7" fill="#2f7a4f"/>
  <text x="550" y="88" font-size="11" fill="#6b7280" text-anchor="middle">9</text>
  <text x="600" y="100" font-size="11" fill="#2f7a4f" text-anchor="start">delivered to</text>
  <text x="600" y="113" font-size="11" fill="#2f7a4f" text-anchor="start">the application</text>
  <text x="600" y="126" font-size="11" fill="#2f7a4f" text-anchor="start">immediately</text>
  <text x="40" y="124" font-size="11" fill="#2f7a4f" text-anchor="start">6, 7, 8, 9 arrive and are processed. You detect the gap at 6 and recover alongside live</text>
  <text x="40" y="139" font-size="11" fill="#2f7a4f" text-anchor="start">traffic (d3). You KNOW your book is untrusted.</text>
  <line x1="12" y1="170" x2="698" y2="170" stroke="#9aa4b2" stroke-width="1"/>
  <text x="12" y="194" font-size="13" fill="#b5501a" text-anchor="start">TCP: the loss is invisible and everything behind it waits</text>
  <line x1="40" y1="246" x2="690" y2="246" stroke="#9aa4b2" stroke-width="1.2"/>
  <circle cx="100" cy="246" r="7" fill="#2f7a4f"/>
  <text x="100" y="230" font-size="11" fill="#6b7280" text-anchor="middle">4</text>
  <circle cx="190" cy="246" r="7" fill="none" stroke="#b5501a" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="190" y="230" font-size="11" fill="#b5501a" text-anchor="middle">lost</text>
  <circle cx="280" cy="246" r="7" fill="#fde8d7" stroke="#b5501a" stroke-width="1.5"/>
  <text x="280" y="230" font-size="11" fill="#b5501a" text-anchor="middle">6</text>
  <circle cx="370" cy="246" r="7" fill="#fde8d7" stroke="#b5501a" stroke-width="1.5"/>
  <text x="370" y="230" font-size="11" fill="#b5501a" text-anchor="middle">7</text>
  <circle cx="460" cy="246" r="7" fill="#fde8d7" stroke="#b5501a" stroke-width="1.5"/>
  <text x="460" y="230" font-size="11" fill="#b5501a" text-anchor="middle">8</text>
  <circle cx="550" cy="246" r="7" fill="#fde8d7" stroke="#b5501a" stroke-width="1.5"/>
  <text x="550" y="230" font-size="11" fill="#b5501a" text-anchor="middle">9</text>
  <rect x="268" y="262" width="330" height="26" rx="2" fill="#fde8d7" stroke="#b5501a" stroke-width="1.5"/>
  <text x="433" y="280" font-size="11" fill="#b5501a" text-anchor="middle">in the receiver's kernel, complete, undelivered</text>
  <text x="40" y="306" font-size="11" fill="#b5501a" text-anchor="start">The bytes have ARRIVED. The kernel will not hand them up, because doing so would break the ordering</text>
  <text x="40" y="321" font-size="11" fill="#b5501a" text-anchor="start">guarantee. Everything waits for 5 to be retransmitted — one round trip, or a timeout if nothing follows to</text>
  <text x="40" y="336" font-size="11" fill="#b5501a" text-anchor="start">trigger fast retransmit.</text>
  <line x1="12" y1="356" x2="698" y2="356" stroke="#9aa4b2" stroke-width="1"/>
  <text x="12" y="378" font-size="12" fill="#1f2328" text-anchor="start">You cannot detect this from inside the application: no gap, no error, no counter. The stream simply</text>
  <text x="12" y="395" font-size="12" fill="#1f2328" text-anchor="start">pauses, and your book is silently stale rather than known-untrusted.</text>
</g>
</svg>
