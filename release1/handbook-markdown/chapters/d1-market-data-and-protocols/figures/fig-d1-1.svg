<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 330" width="710" height="330" role="img" aria-label="Four market-data channels feeding a handler, and below a UDP datagram decomposed into a packet header followed by several length-prefixed messages">
<!--
  figure: fig-d1-1
  purpose: Show that a feed is several channels with different jobs, and that a datagram carries a batch of self-describing messages.
  critical distinction: Reference data is a precondition, not an enrichment; one datagram is not one message.
  forbidden implication: Must not imply the incremental channel is sufficient alone, nor that message layout is fixed across versions.
  generated by build/figures.py — edit there, not here
-->
<defs><marker id="aI" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1f2328"/></marker><marker id="aA" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1a6fb5"/></marker><marker id="aW" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b5501a"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2f7a4f"/></marker><marker id="aM" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker></defs>
<rect width="710" height="330" fill="#ffffff"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <text x="12" y="22" font-size="14" fill="#1f2328" text-anchor="start" font-weight="600">A feed is several channels. A datagram is a batch of messages.</text>
  <rect x="12" y="46" width="164" height="50" rx="2" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.5"/>
  <text x="94.0" y="71.0" font-size="13" fill="#1f2328" text-anchor="middle">Incremental</text>
  <text x="94.0" y="85.0" font-size="11" fill="#6b7280" text-anchor="middle">deltas, very high rate</text>
  <rect x="182" y="46" width="164" height="50" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="264.0" y="71.0" font-size="13" fill="#1f2328" text-anchor="middle">Snapshot / refresh</text>
  <text x="264.0" y="85.0" font-size="11" fill="#6b7280" text-anchor="middle">full image + as-of seq</text>
  <rect x="352" y="46" width="164" height="50" rx="2" fill="#fde8d7" stroke="#b5501a" stroke-width="1.5"/>
  <text x="434.0" y="71.0" font-size="13" fill="#1f2328" text-anchor="middle">Reference data</text>
  <text x="434.0" y="85.0" font-size="11" fill="#6b7280" text-anchor="middle">instrument definitions</text>
  <rect x="522" y="46" width="164" height="50" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="604.0" y="71.0" font-size="13" fill="#1f2328" text-anchor="middle">Status</text>
  <text x="604.0" y="85.0" font-size="11" fill="#6b7280" text-anchor="middle">halts, auction phases</text>
  <text x="12" y="120" font-size="12" fill="#1f2328" text-anchor="start">Reference data is a PRECONDITION: an incremental message names its instrument by numeric ID and</text>
  <text x="12" y="138" font-size="12" fill="#1f2328" text-anchor="start">carries a bare integer price whose exponent comes from the definition.</text>
  <line x1="12" y1="158" x2="698" y2="158" stroke="#9aa4b2" stroke-width="1"/>
  <text x="12" y="182" font-size="13" fill="#1f2328" text-anchor="start">One UDP datagram</text>
  <rect x="12" y="194" width="140" height="54" rx="2" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.5"/>
  <text x="82" y="214" font-size="12" fill="#1f2328" text-anchor="middle">packet header</text>
  <text x="82" y="232" font-size="11" fill="#6b7280" text-anchor="middle">first seq, msg count</text>
  <rect x="156" y="194" width="120" height="54" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="216.0" y="216" font-size="12" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">msg A</text>
  <text x="216.0" y="232" font-size="11" fill="#6b7280" text-anchor="middle">len | type | body</text>
  <rect x="280" y="194" width="150" height="54" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="355.0" y="216" font-size="12" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">msg B</text>
  <text x="355.0" y="232" font-size="11" fill="#6b7280" text-anchor="middle">len | type | body</text>
  <rect x="434" y="194" width="130" height="54" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="499.0" y="216" font-size="12" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">msg C</text>
  <text x="499.0" y="232" font-size="11" fill="#6b7280" text-anchor="middle">len | type | body</text>
  <rect x="568" y="194" width="120" height="54" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="628.0" y="216" font-size="12" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">...</text>
  <text x="628.0" y="232" font-size="11" fill="#6b7280" text-anchor="middle">len | type | body</text>
  <path d="M210 270 L210 252" stroke="#1a6fb5" stroke-width="1.4" fill="none" marker-end="url(#aA)"/>
  <text x="220" y="276" font-size="11" fill="#1a6fb5" text-anchor="start">each message declares its own length — which is what lets you skip a type you</text>
  <text x="220" y="291" font-size="11" fill="#1a6fb5" text-anchor="start">do not know, and why you advance by the declared length rather than by</text>
  <text x="220" y="306" font-size="11" fill="#1a6fb5" text-anchor="start">sizeof(struct)</text>
</g>
</svg>
