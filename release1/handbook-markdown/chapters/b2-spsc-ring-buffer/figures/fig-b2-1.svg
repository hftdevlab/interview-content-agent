<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 390" width="710" height="390" role="img" aria-label="A ring of eight slots with four filled, head marking where the producer writes and tail marking where the consumer reads, with occupancy and slot formulas alongside">
<!--
  figure: fig-b2-1
  purpose: Show that the ring is a fixed array with two monotonic counters, and that only those counters are shared.
  critical distinction: Slots are shared by address but never accessed concurrently; the indices are what guarantees that.
  forbidden implication: Must not imply producer and consumer contend on the slot array, nor that padding removes coherence traffic entirely.
  generated by build/figures.py — edit there, not here
-->
<defs><marker id="aI" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1f2328"/></marker><marker id="aA" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1a6fb5"/></marker><marker id="aW" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b5501a"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2f7a4f"/></marker><marker id="aM" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker></defs>
<rect width="710" height="390" fill="#ffffff"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <text x="12" y="22" font-size="14" fill="#1f2328" text-anchor="start" font-weight="600">Two indices, two owners. Only these two words are shared.</text>
  <circle cx="200" cy="158" r="86" fill="none" stroke="#9aa4b2" stroke-width="34"/>
  <circle cx="200" cy="72" r="15" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.4"/>
  <text x="200.0" y="76.0" font-size="11" fill="#1a6fb5" text-anchor="middle">0</text>
  <circle cx="261" cy="97" r="15" fill="#ffffff" stroke="#9aa4b2" stroke-width="1.4"/>
  <text x="260.81118318204307" y="101.18881681795692" font-size="11" fill="#6b7280" text-anchor="middle">1</text>
  <circle cx="286" cy="158" r="15" fill="#ffffff" stroke="#9aa4b2" stroke-width="1.4"/>
  <text x="286.0" y="162.0" font-size="11" fill="#6b7280" text-anchor="middle">2</text>
  <circle cx="261" cy="219" r="15" fill="#ffffff" stroke="#9aa4b2" stroke-width="1.4"/>
  <text x="260.81118318204307" y="222.81118318204307" font-size="11" fill="#6b7280" text-anchor="middle">3</text>
  <circle cx="200" cy="244" r="15" fill="#ffffff" stroke="#9aa4b2" stroke-width="1.4"/>
  <text x="200.0" y="248.0" font-size="11" fill="#6b7280" text-anchor="middle">4</text>
  <circle cx="139" cy="219" r="15" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.4"/>
  <text x="139.18881681795693" y="222.8111831820431" font-size="11" fill="#1a6fb5" text-anchor="middle">5</text>
  <circle cx="114" cy="158" r="15" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.4"/>
  <text x="114.0" y="162.0" font-size="11" fill="#1a6fb5" text-anchor="middle">6</text>
  <circle cx="139" cy="97" r="15" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.4"/>
  <text x="139.1888168179569" y="101.18881681795692" font-size="11" fill="#1a6fb5" text-anchor="middle">7</text>
  <text x="200" y="152" font-size="11" fill="#6b7280" text-anchor="middle">capacity 8</text>
  <text x="200" y="168" font-size="11" fill="#6b7280" text-anchor="middle">power of two</text>
  <path d="M297.58073580374355 60.41926419625645 L277.78174593052023 80.21825406947978" stroke="#1a6fb5" stroke-width="1.8" fill="none" marker-end="url(#aA)"/>
  <text x="352" y="86" font-size="12" fill="#1a6fb5" text-anchor="start">head — producer writes here</text>
  <path d="M60 270 L123.63246763185288 234.36753236814712" stroke="#b5501a" stroke-width="1.8" fill="none" marker-end="url(#aW)"/>
  <text x="12" y="286" font-size="12" fill="#b5501a" text-anchor="start">tail — consumer reads here</text>
  <text x="352" y="120" font-size="12" fill="#1f2328" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">occupancy = head - tail</text>
  <text x="352" y="142" font-size="12" fill="#1f2328" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">slot      = index &amp; (cap-1)</text>
  <text x="352" y="164" font-size="11" fill="#6b7280" text-anchor="start">counters increase forever and never reset,</text>
  <text x="352" y="180" font-size="11" fill="#6b7280" text-anchor="start">so head == tail means empty and cannot</text>
  <text x="352" y="196" font-size="11" fill="#6b7280" text-anchor="start">also mean full</text>
  <rect x="352" y="214" width="336" height="52" rx="2" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.5"/>
  <text x="366" y="234" font-size="11" fill="#1a6fb5" text-anchor="start">Producer writes the slot, THEN advances head (release).</text>
  <text x="366" y="250" font-size="11" fill="#1a6fb5" text-anchor="start">Consumer reads the slot, THEN advances tail (release).</text>
  <line x1="12" y1="286" x2="698" y2="286" stroke="#9aa4b2" stroke-width="1"/>
  <text x="12" y="320" font-size="12" fill="#1f2328" text-anchor="start">Single writer per index is what buys the wait-free property: no compare-exchange, because there is no</text>
  <text x="12" y="336" font-size="12" fill="#1f2328" text-anchor="start">race to lose.</text>
  <text x="12" y="358" font-size="11" fill="#6b7280" text-anchor="start">head and tail sit on separate cache lines — without that, two threads sharing nothing contend on every operation</text>
  <text x="12" y="374" font-size="11" fill="#6b7280" text-anchor="start">(see a6).</text>
</g>
</svg>
