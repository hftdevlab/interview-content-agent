<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 464" width="710" height="464" role="img" aria-label="Six-step conventional kernel receive path beside a three-step bypass path, with a panel listing the four responsibilities bypass transfers to the application">
<!--
  figure: fig-d6-1
  purpose: Show precisely which steps bypass removes and what it adds in their place.
  critical distinction: The socket buffer was absorbing bursts; removing it removes a shock absorber, not just a copy.
  forbidden implication: Must not imply bypass removes the DMA or the parse, nor that it is free once configured.
  generated by build/figures.py — edit there, not here
-->
<defs><marker id="aI" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1f2328"/></marker><marker id="aA" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1a6fb5"/></marker><marker id="aW" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b5501a"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2f7a4f"/></marker><marker id="aM" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker></defs>
<rect width="710" height="464" fill="#ffffff"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <text x="12" y="22" font-size="14" fill="#1f2328" text-anchor="start" font-weight="600">Bypass removes four steps and hands you back four responsibilities.</text>
  <text x="12" y="50" font-size="13" fill="#b5501a" text-anchor="start">Conventional kernel path</text>
  <rect x="12" y="62" width="290" height="34" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="157.0" y="83.0" font-size="13" fill="#1f2328" text-anchor="middle">NIC DMA</text>
  <text x="310" y="84" font-size="11" fill="#6b7280" text-anchor="start">card writes memory</text>
  <rect x="12" y="102" width="290" height="34" rx="2" fill="#fde8d7" stroke="#b5501a" stroke-width="1.5"/>
  <text x="157.0" y="123.0" font-size="13" fill="#1f2328" text-anchor="middle">interrupt</text>
  <text x="310" y="124" font-size="11" fill="#6b7280" text-anchor="start">preempts a core</text>
  <rect x="12" y="142" width="290" height="34" rx="2" fill="#fde8d7" stroke="#b5501a" stroke-width="1.5"/>
  <text x="157.0" y="163.0" font-size="13" fill="#1f2328" text-anchor="middle">kernel stack</text>
  <text x="310" y="164" font-size="11" fill="#6b7280" text-anchor="start">checksums, demux</text>
  <rect x="12" y="182" width="290" height="34" rx="2" fill="#fde8d7" stroke="#b5501a" stroke-width="1.5"/>
  <text x="157.0" y="203.0" font-size="13" fill="#1f2328" text-anchor="middle">socket buffer</text>
  <text x="310" y="204" font-size="11" fill="#6b7280" text-anchor="start">waits to be scheduled</text>
  <rect x="12" y="222" width="290" height="34" rx="2" fill="#fde8d7" stroke="#b5501a" stroke-width="1.5"/>
  <text x="157.0" y="243.0" font-size="13" fill="#1f2328" text-anchor="middle">syscall + copy</text>
  <text x="310" y="244" font-size="11" fill="#6b7280" text-anchor="start">mode switch + copy</text>
  <rect x="12" y="262" width="290" height="34" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="157.0" y="283.0" font-size="13" fill="#1f2328" text-anchor="middle">your parse</text>
  <text x="310" y="284" font-size="11" fill="#6b7280" text-anchor="start">in your buffer</text>
  <text x="12" y="320" font-size="13" fill="#2f7a4f" text-anchor="start">With kernel bypass</text>
  <rect x="12" y="332" width="290" height="34" rx="2" fill="#dcf0e4" stroke="#2f7a4f" stroke-width="1.5"/>
  <text x="157.0" y="349.0" font-size="13" fill="#1f2328" text-anchor="middle">NIC DMA</text>
  <text x="310" y="354" font-size="11" fill="#6b7280" text-anchor="start">card writes memory — unchanged</text>
  <rect x="12" y="372" width="290" height="34" rx="2" fill="#dcf0e4" stroke="#2f7a4f" stroke-width="1.5"/>
  <text x="157.0" y="389.0" font-size="13" fill="#1f2328" text-anchor="middle">poll the mapped ring</text>
  <text x="310" y="394" font-size="11" fill="#6b7280" text-anchor="start">your thread is already looking</text>
  <rect x="12" y="412" width="290" height="34" rx="2" fill="#dcf0e4" stroke="#2f7a4f" stroke-width="1.5"/>
  <text x="157.0" y="429.0" font-size="13" fill="#1f2328" text-anchor="middle">your parse, IN PLACE</text>
  <text x="310" y="434" font-size="11" fill="#6b7280" text-anchor="start">no copy: the card's buffer is yours</text>
  <rect x="456" y="60" width="242" height="236" rx="2" fill="#fde8d7" stroke="#b5501a" stroke-width="1.5"/>
  <text x="577" y="84" font-size="12" fill="#1f2328" text-anchor="middle">WHAT YOU TAKE ON</text>
  <text x="470" y="110" font-size="11" fill="#b5501a" text-anchor="start">- a core spinning permanently, busy</text>
  <text x="470" y="124" font-size="11" fill="#b5501a" text-anchor="start">or idle</text>
  <text x="470" y="156" font-size="11" fill="#b5501a" text-anchor="start">- protocol work the kernel was</text>
  <text x="470" y="170" font-size="11" fill="#b5501a" text-anchor="start">doing: multicast groups, fragments,</text>
  <text x="470" y="184" font-size="11" fill="#b5501a" text-anchor="start">checksums</text>
  <text x="470" y="202" font-size="11" fill="#b5501a" text-anchor="start">- observability — tcpdump and</text>
  <text x="470" y="216" font-size="11" fill="#b5501a" text-anchor="start">socket counters see nothing</text>
  <text x="470" y="248" font-size="11" fill="#b5501a" text-anchor="start">- the buffering you did not know</text>
  <text x="470" y="262" font-size="11" fill="#b5501a" text-anchor="start">you relied on: nothing absorbs a</text>
  <text x="470" y="276" font-size="11" fill="#b5501a" text-anchor="start">burst now</text>
</g>
</svg>
