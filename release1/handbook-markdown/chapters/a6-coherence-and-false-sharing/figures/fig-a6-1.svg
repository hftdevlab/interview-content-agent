<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 388" width="710" height="388" role="img" aria-label="Four counters packed into one cache line with four threads writing to them, causing ownership to ping-pong; below, the same counters padded onto separate lines">
<!--
  figure: fig-a6-1
  purpose: Show that contention is created by physical adjacency rather than by logical sharing.
  critical distinction: The threads share no variable; they share a line, and the line is the unit of ownership.
  forbidden implication: Must not imply atomics cause the cost, and must not imply padding is free.
  generated by build/figures.py — edit there, not here
-->
<defs><marker id="aI" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1f2328"/></marker><marker id="aA" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1a6fb5"/></marker><marker id="aW" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b5501a"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2f7a4f"/></marker><marker id="aM" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker></defs>
<rect width="710" height="388" fill="#ffffff"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <text x="12" y="22" font-size="14" fill="#1f2328" text-anchor="start" font-weight="600">Coherence works on lines. It has never heard of your variables.</text>
  <text x="12" y="52" font-size="13" fill="#1f2328" text-anchor="start">One 64-byte cache line</text>
  <rect x="12" y="62" width="440" height="46" rx="2" fill="#fde8d7" stroke="#b5501a" stroke-width="1.5"/>
  <line x1="122" y1="62" x2="122" y2="108" stroke="#b5501a" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="67" y="90" font-size="12" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">counter[0]</text>
  <line x1="232" y1="62" x2="232" y2="108" stroke="#b5501a" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="177" y="90" font-size="12" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">counter[1]</text>
  <line x1="342" y1="62" x2="342" y2="108" stroke="#b5501a" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="287" y="90" font-size="12" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">counter[2]</text>
  
  <text x="397" y="90" font-size="12" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">counter[3]</text>
  <text x="466" y="80" font-size="11" fill="#b5501a" text-anchor="start">four independent variables,</text>
  <text x="466" y="96" font-size="11" fill="#b5501a" text-anchor="start">one unit of ownership</text>
  <rect x="21" y="150" width="92" height="40" rx="2" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.5"/>
  <text x="67.0" y="174.0" font-size="13" fill="#1f2328" text-anchor="middle">thread 0</text>
  <path d="M67 148 L67 112" stroke="#1a6fb5" stroke-width="1.4" fill="none" marker-end="url(#aA)"/>
  <rect x="131" y="150" width="92" height="40" rx="2" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.5"/>
  <text x="177.0" y="174.0" font-size="13" fill="#1f2328" text-anchor="middle">thread 1</text>
  <path d="M177 148 L177 112" stroke="#1a6fb5" stroke-width="1.4" fill="none" marker-end="url(#aA)"/>
  <rect x="241" y="150" width="92" height="40" rx="2" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.5"/>
  <text x="287.0" y="174.0" font-size="13" fill="#1f2328" text-anchor="middle">thread 2</text>
  <path d="M287 148 L287 112" stroke="#1a6fb5" stroke-width="1.4" fill="none" marker-end="url(#aA)"/>
  <rect x="351" y="150" width="92" height="40" rx="2" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.5"/>
  <text x="397.0" y="174.0" font-size="13" fill="#1f2328" text-anchor="middle">thread 3</text>
  <path d="M397 148 L397 112" stroke="#1a6fb5" stroke-width="1.4" fill="none" marker-end="url(#aA)"/>
  <text x="12" y="214" font-size="11" fill="#6b7280" text-anchor="start">Each thread writes only its own counter. To write, a core must own the whole line exclusively —</text>
  <text x="12" y="230" font-size="11" fill="#6b7280" text-anchor="start">so every write invalidates the other three cores' copies, and the line ping-pongs.</text>
  <rect x="452" y="204" width="246" height="44" rx="2" fill="#fde8d7" stroke="#b5501a" stroke-width="1.5"/>
  <text x="575" y="222" font-size="11" fill="#b5501a" text-anchor="middle">per-thread throughput FALLS as</text>
  <text x="575" y="236" font-size="11" fill="#b5501a" text-anchor="middle">threads are added</text>
  <line x1="12" y1="264" x2="698" y2="264" stroke="#9aa4b2" stroke-width="1"/>
  <text x="12" y="288" font-size="13" fill="#1f2328" text-anchor="start">Fix: give each its own line.</text>
  <rect x="12" y="300" width="152" height="38" rx="2" fill="#dcf0e4" stroke="#2f7a4f" stroke-width="1.5"/>
  <text x="88" y="318" font-size="12" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">counter[0]+pad</text>
  <rect x="176" y="300" width="152" height="38" rx="2" fill="#dcf0e4" stroke="#2f7a4f" stroke-width="1.5"/>
  <text x="252" y="318" font-size="12" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">counter[1]+pad</text>
  <rect x="340" y="300" width="152" height="38" rx="2" fill="#dcf0e4" stroke="#2f7a4f" stroke-width="1.5"/>
  <text x="416" y="318" font-size="12" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">counter[2]+pad</text>
  <rect x="504" y="300" width="152" height="38" rx="2" fill="#dcf0e4" stroke="#2f7a4f" stroke-width="1.5"/>
  <text x="580" y="318" font-size="12" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">counter[3]+pad</text>
  <text x="12" y="356" font-size="11" fill="#6b7280" text-anchor="start">Cost of the fix is memory — which is why padding a single-threaded scan table (see a5) makes it four times worse</text>
  <text x="12" y="372" font-size="11" fill="#6b7280" text-anchor="start">instead of better.</text>
</g>
</svg>
