<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 312" width="710" height="312" role="img" aria-label="Timestamp capture points from exchange matching engine through the wire to your NIC, kernel and application and back out, each labelled with the clock that owns it">
<!--
  figure: fig-d5-1
  purpose: Show which capture points share a clock, and therefore which subtractions are meaningful.
  critical distinction: Tick-to-trade spans two points on your own NIC clock; exchange-to-application spans two different clocks.
  forbidden implication: Must not imply the clocks are synchronised by default, nor that the exchange timestamp marks the packet leaving their infrastructure.
  generated by build/figures.py — edit there, not here
-->
<defs><marker id="aI" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1f2328"/></marker><marker id="aA" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1a6fb5"/></marker><marker id="aW" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b5501a"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2f7a4f"/></marker><marker id="aM" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker></defs>
<rect width="710" height="312" fill="#ffffff"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <text x="12" y="22" font-size="14" fill="#1f2328" text-anchor="start" font-weight="600">Every timestamp names a clock and a point. Only same-clock subtractions mean anything.</text>
  <line x1="40" y1="120" x2="690" y2="120" stroke="#9aa4b2" stroke-width="1.4"/>
  <circle cx="70" cy="120" r="7" fill="#b5501a"/>
  <text x="70" y="92" font-size="11" fill="#1f2328" text-anchor="middle">matching</text>
  <text x="70" y="105" font-size="11" fill="#1f2328" text-anchor="middle">engine</text>
  <text x="70" y="142" font-size="10.5" fill="#b5501a" text-anchor="middle">EXCHANGE clock</text>
  <circle cx="180" cy="120" r="7" fill="#b5501a"/>
  <text x="180" y="92" font-size="11" fill="#1f2328" text-anchor="middle">their</text>
  <text x="180" y="105" font-size="11" fill="#1f2328" text-anchor="middle">gateway</text>
  <text x="180" y="142" font-size="10.5" fill="#b5501a" text-anchor="middle">EXCHANGE clock</text>
  <circle cx="340" cy="120" r="7" fill="#2f7a4f"/>
  <text x="340" y="92" font-size="11" fill="#1f2328" text-anchor="middle">your NIC</text>
  <text x="340" y="142" font-size="10.5" fill="#2f7a4f" text-anchor="middle">NIC hardware clock</text>
  <circle cx="450" cy="120" r="7" fill="#1a6fb5"/>
  <text x="450" y="92" font-size="11" fill="#1f2328" text-anchor="middle">kernel</text>
  <text x="450" y="142" font-size="10.5" fill="#1a6fb5" text-anchor="middle">system clock</text>
  <circle cx="550" cy="120" r="7" fill="#1a6fb5"/>
  <text x="550" y="92" font-size="11" fill="#1f2328" text-anchor="middle">your app</text>
  <text x="550" y="142" font-size="10.5" fill="#1a6fb5" text-anchor="middle">system clock</text>
  <circle cx="648" cy="120" r="7" fill="#2f7a4f"/>
  <text x="648" y="92" font-size="11" fill="#1f2328" text-anchor="middle">your NIC</text>
  <text x="648" y="105" font-size="11" fill="#1f2328" text-anchor="middle">(send)</text>
  <text x="648" y="142" font-size="10.5" fill="#2f7a4f" text-anchor="middle">NIC hardware clock</text>
  <path d="M340 168 L340 186 L648 186 L648 168" stroke="#2f7a4f" stroke-width="2.2" fill="none" marker-end="url(#aO)"/>
  <text x="500" y="206" font-size="12" fill="#2f7a4f" text-anchor="middle">TICK TO TRADE: same clock, both points yours.</text>
  <text x="500" y="221" font-size="12" fill="#2f7a4f" text-anchor="middle">This is the number to report.</text>
  <path d="M70 60 L70 44 L550 44 L550 60" stroke="#b5501a" stroke-width="2.2" fill="none" marker-end="url(#aW)"/>
  <text x="310" y="34" font-size="11" fill="#b5501a" text-anchor="middle">NOT latency: two clocks with an unknown offset, and it includes work</text>
  <text x="310" y="47" font-size="11" fill="#b5501a" text-anchor="middle">inside the exchange</text>
  <line x1="12" y1="232" x2="698" y2="232" stroke="#9aa4b2" stroke-width="1"/>
  <text x="12" y="254" font-size="12" fill="#1f2328" text-anchor="start">Realtime clocks name instants and can step backwards. Monotonic clocks measure durations and are</text>
  <text x="12" y="271" font-size="12" fill="#1f2328" text-anchor="start">meaningless across machines. A one-way measurement between two machines is only as good as the</text>
  <text x="12" y="288" font-size="12" fill="#1f2328" text-anchor="start">synchronisation between their clocks.</text>
</g>
</svg>
