<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 370" width="710" height="370" role="img" aria-label="Array of structs where each record spans a cache line and only a small price field is read, compared with a hot/cold split where prices are contiguous and four fit per line">
<!--
  figure: fig-a5-1
  purpose: Show that scanning one field of a large struct wastes most of every fetched line, and that splitting makes the scan contiguous.
  critical distinction: The saving is in lines touched, not in bytes read by the program.
  forbidden implication: Must not imply struct-of-arrays is universally better, nor that whole-record access is unaffected.
  generated by build/figures.py — edit there, not here
-->
