  <rect x="12" y="272" width="170" height="10" rx="2" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.5"/>
  <text x="12" y="300" font-size="11" fill="#6b7280" text-anchor="start">one line now carries four orders' prices; the prefetcher sees a clean stride</text>
  <text x="420" y="214" font-size="13" fill="#1f2328" text-anchor="start">cold record, reached by index</text>
  <rect x="420" y="224" width="84" height="40" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="462" y="248" font-size="11" fill="#6b7280" text-anchor="middle">cold 0</text>
  <rect x="508" y="224" width="84" height="40" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="550" y="248" font-size="11" fill="#6b7280" text-anchor="middle">cold 1</text>
  <rect x="596" y="224" width="84" height="40" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="638" y="248" font-size="11" fill="#6b7280" text-anchor="middle">cold 2</text>
  <text x="420" y="300" font-size="11" fill="#6b7280" text-anchor="start">touched only when acting on one specific order</text>
  <line x1="12" y1="318" x2="698" y2="318" stroke="#9aa4b2" stroke-width="1"/>
  <text x="12" y="336" font-size="11" fill="#6b7280" text-anchor="start">Struct-of-arrays is not a better layout, it is a different one: it trades scan cost against whole-record cost.</text>
  <text x="12" y="352" font-size="11" fill="#6b7280" text-anchor="start">Group together what is accessed together.</text>
</g>
