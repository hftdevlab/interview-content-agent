<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 430" width="710" height="430" role="img" aria-label="A plane with event time horizontal and knowledge time vertical, the upper-left region shaded as knowable and the lower-right as impossible, with a trade, a fill, a later correction of the same trade, and a backdated reference-data restatement">
<!--
  figure: fig-e4-2
  purpose: Show that a fact has two independent times and that only records whose knowledge time is at or after their event time could ever have been available.
  critical distinction: A correction is a new record at a later knowledge time, not an edit of the original.
  forbidden implication: Must not imply corrections replace the original record, nor that event time alone identifies what was known.
  generated by build/figures.py — edit there, not here
-->
<defs><marker id="aI" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1f2328"/></marker><marker id="aA" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1a6fb5"/></marker><marker id="aW" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b5501a"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2f7a4f"/></marker><marker id="aM" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker></defs>
<rect width="710" height="430" fill="#ffffff"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <text x="12" y="22" font-size="14" fill="#1f2328" text-anchor="start" font-weight="600">Two time axes. Only the region above the diagonal was ever available to you.</text>
  <path d="M96 308 L96 58 L526 58 Z" fill="#dcf0e4" opacity="0.6"/>
  <path d="M96 308 L526 58 L526 308 Z" fill="#fde8d7" opacity="0.5"/>
  <path d="M96 308 L526 58" stroke="#9aa4b2" stroke-width="1.4" fill="none"/>
  <line x1="96" y1="308" x2="526" y2="308" stroke="#9aa4b2" stroke-width="1.4"/>
  <line x1="96" y1="58" x2="96" y2="308" stroke="#9aa4b2" stroke-width="1.4"/>
  <text x="311.0" y="340" font-size="12" fill="#1f2328" text-anchor="middle">event time — when it happened in the world</text>
  <text x="40" y="183.0" font-size="12" fill="#1f2328" text-anchor="middle" transform="rotate(-90 40 183.0)">knowledge time — when you learned it</text>
  <text x="170" y="188.0" font-size="12" fill="#2f7a4f" text-anchor="middle">KNOWABLE</text>
  <text x="170" y="206.0" font-size="11" fill="#2f7a4f" text-anchor="middle">learned at or after</text>
  <text x="170" y="220.0" font-size="11" fill="#2f7a4f" text-anchor="middle">it happened</text>
  <text x="434" y="262" font-size="12" fill="#b5501a" text-anchor="middle">IMPOSSIBLE</text>
  <text x="434" y="280" font-size="11" fill="#b5501a" text-anchor="middle">would require knowing it</text>
  <text x="434" y="293" font-size="11" fill="#b5501a" text-anchor="middle">first</text>
  <circle cx="208" cy="223" r="6" fill="#2f7a4f"/>
  <text x="219.8" y="227.0" font-size="11" fill="#2f7a4f" text-anchor="start">trade printed</text>
  <circle cx="337" cy="153" r="6" fill="#2f7a4f"/>
  <text x="348.8" y="157.0" font-size="11" fill="#2f7a4f" text-anchor="start">fill received</text>
  <circle cx="208" cy="93" r="6" fill="#b5501a"/>
  <text x="219.8" y="97.0" font-size="11" fill="#b5501a" text-anchor="start">same trade, CORRECTED at 14:20</text>
  <circle cx="423" cy="118" r="6" fill="#b5501a"/>
  <text x="434.8" y="122.0" font-size="11" fill="#b5501a" text-anchor="start">ref data restated, backdated</text>
  <path d="M208 215 L208 103" stroke="#b5501a" stroke-width="1.4" fill="none" marker-end="url(#aW)" stroke-dasharray="3 3"/>
  <text x="548" y="176" font-size="11" fill="#b5501a" text-anchor="start">one event, two records —</text>
  <text x="548" y="190" font-size="11" fill="#b5501a" text-anchor="start">the correction is a new</text>
  <text x="548" y="204" font-size="11" fill="#b5501a" text-anchor="start">point higher up, never</text>
  <text x="548" y="218" font-size="11" fill="#b5501a" text-anchor="start">an edit of the first</text>
  <line x1="12" y1="352" x2="698" y2="352" stroke="#9aa4b2" stroke-width="1"/>
  <text x="12" y="374" font-size="12" fill="#1f2328" text-anchor="start">A backtest asking "what was true about 10:00?" reads the corrected value and assumes knowledge nobody</text>
  <text x="12" y="391" font-size="12" fill="#1f2328" text-anchor="start">had. Asking "what did we know as of 10:00?" is a horizontal cut through this plane, and it is the only</text>
  <text x="12" y="408" font-size="12" fill="#1f2328" text-anchor="start">question that does not leak the future.</text>
</g>
</svg>
