<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 382" width="710" height="382" role="img" aria-label="Environment inputs crossing a capture boundary that assigns sequence numbers and timestamps into an ordered event log, feeding a pure core with no clock reads, randomness, races or unrecorded inputs">
<!--
  figure: fig-e4-1
  purpose: Show that determinism comes from recording everything at a boundary and keeping the core a pure function of that record.
  critical distinction: The clock is read once at the boundary and becomes data; the core never reads it.
  forbidden implication: Must not imply only market data is captured, nor that the core may be multi-threaded without a recorded merge order.
  generated by build/figures.py — edit there, not here
-->
<defs><marker id="aI" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1f2328"/></marker><marker id="aA" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1a6fb5"/></marker><marker id="aW" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b5501a"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2f7a4f"/></marker><marker id="aM" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker></defs>
<rect width="710" height="382" fill="#ffffff"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <text x="12" y="22" font-size="14" fill="#1f2328" text-anchor="start" font-weight="600">Record everything that crosses the boundary. Inside it, nothing may vary.</text>
  <rect x="12" y="46" width="180" height="236" rx="2" fill="none" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="102" y="68" font-size="12" fill="#6b7280" text-anchor="middle">ENVIRONMENT</text>
  <rect x="24" y="80" width="156" height="30" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="102" y="99" font-size="11" fill="#6b7280" text-anchor="middle">market data packets</text>
  <rect x="24" y="118" width="156" height="30" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="102" y="137" font-size="11" fill="#6b7280" text-anchor="middle">venue responses</text>
  <rect x="24" y="156" width="156" height="30" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="102" y="175" font-size="11" fill="#6b7280" text-anchor="middle">control commands</text>
  <rect x="24" y="194" width="156" height="30" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="102" y="213" font-size="11" fill="#6b7280" text-anchor="middle">configuration</text>
  <rect x="24" y="232" width="156" height="30" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="102" y="251" font-size="11" fill="#6b7280" text-anchor="middle">timer firings</text>
  <rect x="212" y="46" width="150" height="236" rx="2" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.5"/>
  <text x="287" y="68" font-size="12" fill="#1a6fb5" text-anchor="middle">BOUNDARY</text>
  <text x="287" y="96" font-size="11" fill="#1a6fb5" text-anchor="middle">assign sequence</text>
  <text x="287" y="120" font-size="11" fill="#1a6fb5" text-anchor="middle">read the clock ONCE,</text>
  <text x="287" y="133" font-size="11" fill="#1a6fb5" text-anchor="middle">here</text>
  <text x="287" y="158" font-size="11" fill="#1a6fb5" text-anchor="middle">write to capture</text>
  <rect x="228" y="186" width="118" height="42" rx="2" fill="#dcf0e4" stroke="#2f7a4f" stroke-width="1.5"/>
  <text x="287" y="204" font-size="11" fill="#1f2328" text-anchor="middle">ordered event log</text>
  <text x="287" y="222" font-size="11" fill="#6b7280" text-anchor="middle">raw bytes</text>
  <path d="M184 95 L208 140" stroke="#6b7280" stroke-width="1.1" fill="none" marker-end="url(#aM)"/>
  <path d="M184 133 L208 140" stroke="#6b7280" stroke-width="1.1" fill="none" marker-end="url(#aM)"/>
  <path d="M184 171 L208 140" stroke="#6b7280" stroke-width="1.1" fill="none" marker-end="url(#aM)"/>
  <path d="M184 209 L208 140" stroke="#6b7280" stroke-width="1.1" fill="none" marker-end="url(#aM)"/>
  <path d="M184 247 L208 140" stroke="#6b7280" stroke-width="1.1" fill="none" marker-end="url(#aM)"/>
  <rect x="382" y="46" width="306" height="236" rx="2" fill="#dcf0e4" stroke="#2f7a4f" stroke-width="1.5"/>
  <text x="535" y="68" font-size="12" fill="#2f7a4f" text-anchor="middle">CORE — pure function</text>
  <text x="396" y="96" font-size="11" fill="#6b7280" text-anchor="start">- no clock reads: time arrives in the event</text>
  <text x="396" y="128" font-size="11" fill="#6b7280" text-anchor="start">- no randomness: identities are derived</text>
  <text x="396" y="160" font-size="11" fill="#6b7280" text-anchor="start">- no races: the merge order was recorded</text>
  <text x="396" y="192" font-size="11" fill="#6b7280" text-anchor="start">- no address-ordered iteration</text>
  <text x="396" y="224" font-size="11" fill="#6b7280" text-anchor="start">- no unrecorded input</text>
  <path d="M366 164 L378 164" stroke="#2f7a4f" stroke-width="1.6" fill="none" marker-end="url(#aO)"/>
  <rect x="396" y="254" width="278" height="20" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="535" y="268" font-size="11" fill="#1f2328" text-anchor="middle">outputs: orders, cancels, published state</text>
  <line x1="12" y1="300" x2="698" y2="300" stroke="#9aa4b2" stroke-width="1"/>
  <text x="12" y="322" font-size="12" fill="#1f2328" text-anchor="start">Replay feeds the same log into the same core and compares. A state hash per event turns "the output</text>
  <text x="12" y="339" font-size="12" fill="#1f2328" text-anchor="start">differs somewhere in four million events" into "the state first diverged at event 1,284,551" — and the</text>
  <text x="12" y="356" font-size="12" fill="#1f2328" text-anchor="start">FIRST divergence is the cause.</text>
</g>
</svg>
