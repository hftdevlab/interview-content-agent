<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 400" width="710" height="400" role="img" aria-label="Three memory layouts: a general allocator with fragmented live blocks and holes, a pool of uniform slots, and an arena as one contiguous used region with an offset pointer">
<!--
  figure: fig-c3-1
  purpose: Show that the three allocators differ in the shape of the memory they manage, and that the arena's shape is what makes reset possible.
  critical distinction: The arena has no holes because it never frees individually — that is the trade, not a bonus.
  forbidden implication: Must not suggest an arena can free one object, and must not suggest a pool suffers fragmentation.
  generated by build/figures.py — edit there, not here
-->
<defs><marker id="aI" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1f2328"/></marker><marker id="aA" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1a6fb5"/></marker><marker id="aW" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b5501a"/></marker><marker id="aO" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2f7a4f"/></marker><marker id="aM" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker></defs>
<rect width="710" height="400" fill="#ffffff"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <text x="12" y="22" font-size="14" fill="#1f2328" text-anchor="start" font-weight="600">Three bets about how objects die.</text>
  <text x="12" y="52" font-size="13" fill="#1f2328" text-anchor="start">General allocator — arbitrary size, independent lifetimes</text>
  <rect x="12" y="62" width="60" height="34" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <rect x="72" y="62" width="34" height="34" rx="2" fill="#ffffff" stroke="#9aa4b2" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="106" y="62" width="94" height="34" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <rect x="200" y="62" width="24" height="34" rx="2" fill="#ffffff" stroke="#9aa4b2" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="224" y="62" width="46" height="34" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <rect x="270" y="62" width="58" height="34" rx="2" fill="#ffffff" stroke="#9aa4b2" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="328" y="62" width="70" height="34" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="410" y="76" font-size="11" fill="#6b7280" text-anchor="start">holes between live blocks = fragmentation; free</text>
  <text x="410" y="91" font-size="11" fill="#6b7280" text-anchor="start">must find, split, and merge</text>
  <text x="12" y="140" font-size="13" fill="#1f2328" text-anchor="start">Pool / slab — fixed size, independent lifetimes</text>
  <rect x="12" y="150" width="54" height="34" rx="2" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.5"/>
  <rect x="68" y="150" width="54" height="34" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <rect x="124" y="150" width="54" height="34" rx="2" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.5"/>
  <rect x="180" y="150" width="54" height="34" rx="2" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.5"/>
  <rect x="236" y="150" width="54" height="34" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <rect x="292" y="150" width="54" height="34" rx="2" fill="#f3f4f6" stroke="#9aa4b2" stroke-width="1.2"/>
  <rect x="348" y="150" width="54" height="34" rx="2" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.5"/>
  <text x="414" y="164" font-size="11" fill="#6b7280" text-anchor="start">uniform slots, so any free one will do; free</text>
  <text x="414" y="179" font-size="11" fill="#6b7280" text-anchor="start">returns an index, with no search</text>
  <text x="12" y="228" font-size="13" fill="#1f2328" text-anchor="start">Arena — arbitrary sizes, ONE shared end point</text>
  <rect x="12" y="238" width="330" height="34" rx="2" fill="#dbeafe" stroke="#1a6fb5" stroke-width="1.5"/>
  <rect x="342" y="238" width="252" height="34" rx="2" fill="#ffffff" stroke="#9aa4b2" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="177" y="260" font-size="12" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">used</text>
  <text x="468" y="260" font-size="12" fill="#6b7280" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">unused</text>
  <path d="M342 292 L342 276" stroke="#1a6fb5" stroke-width="1.4" fill="none" marker-end="url(#aA)"/>
  <text x="348" y="300" font-size="11" fill="#1a6fb5" text-anchor="start">offset — allocate by advancing it</text>
  <text x="606" y="252" font-size="11" fill="#6b7280" text-anchor="start">no per-object</text>
  <text x="606" y="266" font-size="11" fill="#6b7280" text-anchor="start">free exists</text>
  <path d="M330 316 Q180 340 24 322" stroke="#b5501a" stroke-width="1.8" fill="none" marker-end="url(#aW)"/>
  <text x="12" y="360" font-size="11" fill="#b5501a" text-anchor="start">reset(): offset = 0. Frees everything in one instruction — and any surviving pointer into the region now dangles,</text>
  <text x="12" y="375" font-size="11" fill="#b5501a" text-anchor="start">into memory that is handed out again immediately.</text>
</g>
</svg>
